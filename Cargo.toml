[package]
name = "k8s-tcp-mesh-probe"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[dependencies]
anyhow = "1"
axum = "0.7"
futures = "0.3"
jemallocator = "0.5"
k8s-openapi = { version = "0.23", features = ["v1_30"] }
kube = { version = "0.96", features = ["client", "rustls-tls"] }
prometheus = "0.13"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = { version = "0.12", features = ["transport"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"
